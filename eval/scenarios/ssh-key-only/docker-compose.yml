services:
  sshd:
    image: linuxserver/openssh-server:latest
    ports:
      - "18022:2222"
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: eval
      USER_PASSWORD: evalpass
    volumes:
      - ./workspace/sshd_config:/etc/ssh/sshd_config:ro
      - ./workspace/authorized_keys:/config/.ssh/authorized_keys:ro
