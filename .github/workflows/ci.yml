# Continuous integration for ma3
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        env:
          MA3_DISABLE_EMBEDDINGS: "1"
          MA3_DEV_AUTH: "1"
          MA3_DEV_API_KEY: ma3dev
        run: pytest -q tests/unit

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integration tests
        env:
          MA3_DISABLE_EMBEDDINGS: "1"
          MA3_DEV_AUTH: "1"
          MA3_DEV_API_KEY: ma3dev
        run: pytest -q tests/integration

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-host image
        run: docker build -f deploy/self-host/Dockerfile -t ma3-selfhost:ci .
