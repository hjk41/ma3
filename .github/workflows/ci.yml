# Continuous integration for ma3
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        env:
          MA3_DISABLE_EMBEDDINGS: "1"
          MA3_DEV_AUTH: "1"
          MA3_DEV_API_KEY: ma3dev
        run: pytest -q tests/unit

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integration tests (SQLite)
        env:
          MA3_DISABLE_EMBEDDINGS: "1"
          MA3_DEV_AUTH: "1"
          MA3_DEV_API_KEY: ma3dev
        run: pytest -q tests/integration

  integration-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ma3
          POSTGRES_PASSWORD: ma3pass
          POSTGRES_DB: ma3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ma3 -d ma3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Postgres migration tests
        env:
          MA3_DATABASE_URL: postgresql://ma3:ma3pass@localhost:5432/ma3
          MA3_DISABLE_EMBEDDINGS: "1"
          MA3_DEV_AUTH: "1"
          MA3_DEV_API_KEY: ma3dev
        # Clear default addopts so -m postgres is not excluded
        run: pytest -q -o addopts= -m "postgres and not deploy"
      - name: Integration smoke on Postgres
        env:
          MA3_CI_DATABASE_URL: postgresql://ma3:ma3pass@localhost:5432/ma3
          MA3_DISABLE_EMBEDDINGS: "1"
          MA3_DEV_AUTH: "1"
          MA3_DEV_API_KEY: ma3dev
        # Representative production path (auth / portal REST / invites / MCP / writes).
        # Full suite: MA3_CI_DATABASE_URL=... pytest -q tests/integration
        run: >
          pytest -q
          tests/integration/test_local_auth_api.py
          tests/integration/test_portal_rest_api.py
          tests/integration/test_org_invites_api.py
          tests/integration/test_mcp_integration.py
          tests/integration/test_write_audit_and_delete.py
          tests/integration/test_setup_first_run.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-host image
        run: docker build -f deploy/self-host/Dockerfile -t ma3-selfhost:ci .
