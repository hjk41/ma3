# Nightly quality extras (Tier A portal smoke + optional Authing E2E).
name: nightly

on:
  schedule:
    # 02:30 Asia/Shanghai ≈ 18:30 UTC previous day
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  e2e-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            code/server/requirements.txt
            code/server/requirements-e2e.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-e2e.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('code/server/requirements-e2e.txt') }}
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Portal Playwright smoke (local-auth)
        env:
          MA3_DISABLE_EMBEDDINGS: "1"
        run: pytest -q -o addopts= -m e2e tests/e2e --browser chromium --screenshot only-on-failure

  e2e-authing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            code/server/requirements.txt
            code/server/requirements-e2e.txt
      - name: Authing E2E (secrets-gated)
        env:
          AUTHING_TEST_USER: ${{ secrets.AUTHING_TEST_USER }}
          AUTHING_TEST_PASS: ${{ secrets.AUTHING_TEST_PASS }}
          MA3_E2E_BASE_URL: ${{ vars.MA3_E2E_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${AUTHING_TEST_USER:-}" || -z "${AUTHING_TEST_PASS:-}" || -z "${MA3_E2E_BASE_URL:-}" ]]; then
            echo "SKIPPED: Authing E2E secrets not configured (need AUTHING_TEST_USER, AUTHING_TEST_PASS secrets and MA3_E2E_BASE_URL variable)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-e2e.txt
          playwright install --with-deps chromium
          python scripts/e2e_authing_ui.py
