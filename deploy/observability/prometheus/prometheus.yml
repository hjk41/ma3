global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

# Optional local/lab stack only. Do NOT run Prometheus on the ma3.io app host —
# SaaS reachability alerts come from the off-host probe on the operator laptop.
# App-host /metrics remains loopback-only for manual curl / future remote scrape.
scrape_configs:
  - job_name: ma3-local
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          service: ma3
