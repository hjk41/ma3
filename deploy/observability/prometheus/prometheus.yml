global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

# App-host scrape of loopback uvicorn. Active port is written by blue-green cutover
# to data/bluegreen/prometheus-targets.json (file_sd). Do not hardcode :8000.
# No remote_write — TSDB stays on this host.
scrape_configs:
  - job_name: ma3
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/prometheus-targets.json
        refresh_interval: 15s
