global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: ma3
    metrics_path: /metrics
    static_configs:
      # Prefer host-network Prometheus scraping uvicorn on loopback.
      # (Docker bridge cannot reach processes bound to 127.0.0.1.)
      - targets: ["127.0.0.1:8000"]
        labels:
          service: ma3
