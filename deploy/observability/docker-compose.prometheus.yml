# Optional local/lab Prometheus — NOT for the Aliyun ma3.io app host.
# SaaS paging = off-host probe on the operator laptop (see README.md).
#
#   bash deploy/observability/run_local_stack.sh
#   # or: cd deploy/observability && docker compose -f docker-compose.prometheus.yml up -d
#
# Scrapes loopback only; keep /metrics off the public Caddy site.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ma3_prom_data:/prometheus
    # Loopback-only on the host — operators curl via SSH tunnel if needed.
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ma3_prom_data:
