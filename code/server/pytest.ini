[pytest]
testpaths = tests
pythonpath = .
markers =
    deploy: live deployment verification against MA3_BASE_URL
    postgres: requires PostgreSQL via MA3_DATABASE_URL
    docker: Docker-based agent client install/upgrade scenario
    e2e: Playwright portal smoke (local-auth; see tests/e2e/)
addopts = -m "not deploy and not postgres and not docker and not e2e"
