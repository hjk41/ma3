[pytest]
testpaths = tests
pythonpath = .
markers =
    deploy: live deployment verification against MA3_BASE_URL
    postgres: requires PostgreSQL via MA3_DATABASE_URL
    docker: Docker-based agent client install/upgrade scenario
    e2e: Playwright portal smoke (local-auth; see tests/e2e/)
    billing_p0: org+billing P0 acceptance (design/27); expected red until Composer lands P0
    billing_p1: org+billing P1 metering/enforcement/portal acceptance (design/27); skips or fails until Composer lands P1
    billing_p2: org+billing P2 Stripe checkout/webhook/portal acceptance (design/27); skips or fails until Composer lands P2
addopts = -m "not deploy and not postgres and not docker and not e2e"
