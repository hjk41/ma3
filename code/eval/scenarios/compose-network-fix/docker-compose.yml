services:
  backend:
    image: hashicorp/http-echo
    command: ["-text=hello-from-compose-backend"]
    expose:
      - "5678"

  frontend:
    image: nginx:alpine
    ports:
      - "18081:80"
    volumes:
      - ./workspace/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
