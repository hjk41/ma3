services:
  proxy:
    image: vimagick/tinyproxy:latest
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    expose:
      - "8888"
    healthcheck:
      test: ["CMD-SHELL", "pgrep tinyproxy >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  client:
    image: alpine:3.19
    cap_add:
      - NET_ADMIN
    depends_on:
      proxy:
        condition: service_healthy
    network_mode: "service:proxy"
    volumes:
      - ./workspace:/workspace:ro
    entrypoint:
      - sh
      - -c
      - apk add --no-cache iptables curl >/dev/null && exec sleep infinity
