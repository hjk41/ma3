databases:
  - name: ma3-db
    databaseName: ma3
    user: ma3

services:
  - type: web
    name: ma3
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: MA3_DATABASE_URL
        fromDatabase:
          name: ma3-db
          property: connectionString
