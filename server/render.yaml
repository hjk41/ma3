services:
  - type: web
    name: ma3
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: MA3_DB_PATH
        value: /var/data/ma3.db
    disk:
      name: ma3-data
      mountPath: /var/data
      sizeGB: 1
